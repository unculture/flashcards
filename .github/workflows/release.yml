name: Release

# Pushing a tag such as v0.2.0 builds the Windows and Mac installers and puts
# them on a public GitHub release. scripts/release.sh makes the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundles: dmg
            files: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2.3.2
        with:
          files: installers/*
          generate_release_notes: true
          body: |
            ## Install

            **Windows:** download the `.exe` and run it. Windows may say it protected your PC, because the installer is not signed. Choose **More info**, then **Run anyway**.

            **Mac (Apple silicon):** download the `.dmg`, open it, and drag Flashcards to Applications. The app is not notarised, so the first time, open **System Settings › Privacy & Security** and choose **Open Anyway**.
