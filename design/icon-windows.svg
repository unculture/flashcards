<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="92 92 840 840">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7bbb"/>
      <stop offset="1" stop-color="#22497a"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#f7b733"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b2240" flood-opacity="0.35"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded square, inside the macOS icon grid. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#iconShadow)"/>

  <g transform="translate(-40 15)">
  <!-- Back card -->
  <g transform="rotate(-9 470 560)" filter="url(#shadow)">
    <rect x="250" y="390" width="440" height="320" rx="36" fill="#e9dfc8"/>
  </g>

  <!-- Front card, with a question mark -->
  <g transform="rotate(4 500 590)" filter="url(#shadow)">
    <rect x="290" y="440" width="440" height="320" rx="36" fill="#fffdf7"/>
    <text x="510" y="680" text-anchor="middle" font-family="Arial Rounded MT Bold, Helvetica Neue, Arial, sans-serif"
          font-weight="700" font-size="220" fill="#2c5c8f">?</text>
  </g>

  <!-- Speech bubble -->
  <g filter="url(#shadow)">
    <path d="M620 210 h170 a90 90 0 0 1 90 90 v40 a90 90 0 0 1 -90 90 h-90 l-70 62 l12 -62 h-22 a90 90 0 0 1 -90 -90 v-40 a90 90 0 0 1 90 -90 z"
          fill="url(#bubble)"/>
    <circle cx="630" cy="320" r="24" fill="#2c5c8f"/>
    <circle cx="705" cy="320" r="24" fill="#2c5c8f"/>
    <circle cx="780" cy="320" r="24" fill="#2c5c8f"/>
  </g>
  </g>
</svg>
